name: Debian 13 CI and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  debian:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Debian 13 test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            appstream ca-certificates desktop-file-utils fakeroot git iproute2 \
            iputils-ping lintian pkexec python3 python3-tk xauth xdg-utils xvfb

      - uses: actions/checkout@v7

      - name: Verify source version and run tests
        run: |
          version="$(PYTHONPATH=src python3 -c 'from ip_analyser import __version__; print(__version__)')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "v$version" = "$GITHUB_REF_NAME"; fi
          python3 -m compileall -q src tests
          PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Build Debian package
        run: sh packaging/build-deb.sh

      - name: Validate package and desktop metadata
        run: |
          package="$(find dist -maxdepth 1 -name 'advanced-ip-analyser_*_all.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" > package-contents.txt
          grep -q './usr/share/doc/advanced-ip-analyser/copyright' package-contents.txt
          grep -q './usr/share/man/man1/advanced-ip-analyser-gui.1.gz' package-contents.txt
          grep -q './usr/share/metainfo/advanced-ip-analyser.metainfo.xml' package-contents.txt
          grep -q './usr/share/icons/hicolor/scalable/apps/advanced-ip-analyser.svg' package-contents.txt
          lintian --fail-on error "$package"
          desktop-file-validate packaging/debian/usr/share/applications/advanced-ip-analyser.desktop
          appstreamcli validate --no-net packaging/debian/usr/share/metainfo/advanced-ip-analyser.metainfo.xml

      - name: Install, launch, and remove package
        run: |
          package="./$(find dist -maxdepth 1 -name 'advanced-ip-analyser_*_all.deb' -print -quit)"
          apt-get install --yes --no-install-recommends "$package"
          advanced-ip-analyser --help > /dev/null
          advanced-ip-analyser capture-interfaces > /dev/null
          set +e
          timeout 10s xvfb-run -a advanced-ip-analyser-gui
          status=$?
          set -e
          test "$status" -eq 124
          dpkg --remove advanced-ip-analyser

      - name: Create published checksum
        run: cd dist && sha256sum *.deb > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: advanced-ip-analyser-debian-13
          path: |
            dist/*.deb
            dist/SHA256SUMS

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/SHA256SUMS

  apt-repository:
    if: startsWith(github.ref, 'refs/tags/')
    needs: debian
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: advanced-ip-analyser-debian-13
          path: release

      - name: Check APT signing configuration
        id: signing
        env:
          APT_SIGNING_KEY_B64: ${{ secrets.APT_SIGNING_KEY_B64 }}
        run: |
          if [ -n "$APT_SIGNING_KEY_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "APT repository skipped: add the APT_SIGNING_KEY_B64 repository secret."
          fi

      - name: Build signed Debian 13 APT repository
        if: steps.signing.outputs.enabled == 'true'
        env:
          APT_SIGNING_KEY_B64: ${{ secrets.APT_SIGNING_KEY_B64 }}
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils dpkg-dev gnupg
          mkdir -p apt-site/pool/main/a/advanced-ip-analyser \
                   apt-site/dists/trixie/main/binary-all
          cp release/advanced-ip-analyser_*_all.deb apt-site/pool/main/a/advanced-ip-analyser/
          printf '%s' "$APT_SIGNING_KEY_B64" | base64 --decode | gpg --batch --import
          signing_key="$APT_SIGNING_KEY_ID"
          if [ -z "$signing_key" ]; then
            signing_key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" {print $5; exit}')
          fi
          test -n "$signing_key"
          (
            cd apt-site
            dpkg-scanpackages --arch all pool /dev/null > dists/trixie/main/binary-all/Packages
            gzip -9n -c dists/trixie/main/binary-all/Packages > dists/trixie/main/binary-all/Packages.gz
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin='Advanced IP Analyser' \
              -o APT::FTPArchive::Release::Label='Advanced IP Analyser' \
              -o APT::FTPArchive::Release::Suite='stable' \
              -o APT::FTPArchive::Release::Codename='trixie' \
              -o APT::FTPArchive::Release::Architectures='all' \
              -o APT::FTPArchive::Release::Components='main' \
              -o APT::FTPArchive::Release::Description='Advanced IP Analyser for Debian 13' \
              release dists/trixie > dists/trixie/Release
            gpg --batch --yes --local-user "$signing_key" --clearsign \
              --output dists/trixie/InRelease dists/trixie/Release
            gpg --batch --yes --local-user "$signing_key" --detach-sign \
              --armor --output dists/trixie/Release.gpg dists/trixie/Release
            gpg --batch --yes --local-user "$signing_key" --export \
              --output advanced-ip-analyser-archive-keyring.gpg
          )
          cat > apt-site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Advanced IP Analyser APT repository</title>
          <h1>Advanced IP Analyser for Debian 13</h1>
          <p>This is the signed package repository for Advanced IP Analyser.</p>
          <p>See the project README for installation instructions.</p>
          EOF

      - uses: actions/upload-pages-artifact@v5
        if: steps.signing.outputs.enabled == 'true'
        with:
          path: apt-site

  deploy-apt-repository:
    if: needs.apt-repository.outputs.enabled == 'true'
    needs: apt-repository
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish signed APT repository
        id: deployment
        uses: actions/deploy-pages@v5
