name: ShipProof
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shipproof-ip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-shipproof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop test dependencies
        run: python -m pip install -e .
      - name: Verify project
        env:
          STAGE: ${{ github.event_name == 'pull_request' && 'pr' || 'merge' }}
        run: python scripts/shipproof.py --stage "$STAGE"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shipproof-ip-evidence
          path: .shipproof/
          if-no-files-found: warn

          include-hidden-files: true
