name: Debian 13 CI and release

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  debian:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates fakeroot git libgtk-3-0t64 openjdk-21-jdk unzip xauth xvfb

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test and build Debian package
        run: xvfb-run -a ./gradlew --no-daemon test linux64
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: advanced-ip-analyser-debian-13
          path: build/libs/*.deb

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          generate_release_notes: true
          files: build/libs/*.deb
