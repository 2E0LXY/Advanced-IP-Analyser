name: Publish v3.0.4 and Android 1.2.9 release tags (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-3-0-4-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Create release tags on this main commit and start the release workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          desktop=3.0.4
          android=1.2.9
          grep -Fq "version = \"$desktop\"" pyproject.toml
          grep -Fq "versionName = \"$android\"" android/app/build.gradle.kts

          if gh release view "v$desktop" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$desktop is already released; nothing to do."
            exit 0
          fi

          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/v$desktop" -f "sha=$GITHUB_SHA"
          gh workflow run debian.yml --repo "$GITHUB_REPOSITORY" --ref "v$desktop"
          gh workflow run windows.yml --repo "$GITHUB_REPOSITORY" --ref "v$desktop"

          # The Android release attaches its APK to the latest desktop release, so wait
          # until both desktop assets are published before starting it.
          ready=false
          for attempt in $(seq 1 180); do
            sleep 10
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            [ "$latest" = "v$desktop" ] || continue
            names=$(gh release view "v$desktop" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if grep -Fxq "Advanced-IP-Analyser-Setup-$desktop.exe" <<<"$names" &&
               grep -Fxq "advanced-ip-analyser_${desktop}_all.deb" <<<"$names"; then
              ready=true
              break
            fi
          done
          if [ "$ready" != true ]; then
            echo "Desktop release not ready; the Android release was not started." >&2
            exit 1
          fi

          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/android-v$android" -f "sha=$GITHUB_SHA"
          gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref "android-v$android"
