name: Debian source package

on:
  push:
    branches: ['**']
    paths:
      - 'debian/**'
      - '.github/workflows/debian-source.yml'
  pull_request:
    paths:
      - 'debian/**'
      - '.github/workflows/debian-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-24.04
    container: debian:sid-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Debian packaging tools and build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            appstream autopkgtest build-essential ca-certificates debhelper \
            desktop-file-utils devscripts dh-python fakeroot git lintian \
            pybuild-plugin-pyproject python3-all python3-defusedxml \
            python3-setuptools python3-tk xauth xvfb

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Assemble pristine upstream and Debian packaging
        run: |
          version="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          app_version="$(PYTHONPATH=src python3 -c 'from ip_analyser import __version__; print(__version__)')"
          test "$version" = "$app_version"
          treeish=HEAD
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            treeish="v$version"
          fi
          mkdir -p build-area
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar --prefix="advanced-ip-analyser-$version/" \
            --output="build-area/advanced-ip-analyser_${version}.orig.tar" "$treeish"
          gzip -n "build-area/advanced-ip-analyser_${version}.orig.tar"
          tar -C build-area -xzf "build-area/advanced-ip-analyser_${version}.orig.tar.gz"
          cp -a debian "build-area/advanced-ip-analyser-$version/"

      - name: Validate Debian metadata
        run: |
          version="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          cd "build-area/advanced-ip-analyser-$version"
          desktop-file-validate packaging/debian/usr/share/applications/advanced-ip-analyser.desktop
          set +e
          uscan --report-status
          uscan_status=$?
          set -e
          test "$uscan_status" -le 1

      - name: Build source and binary packages
        run: |
          version="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          cd "build-area/advanced-ip-analyser-$version"
          dpkg-buildpackage --no-sign -S
          dpkg-buildpackage --no-sign -b

      - name: Run Lintian policy checks
        run: |
          version="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          cd build-area
          appstreamcli validate-tree --no-net "advanced-ip-analyser-$version/debian/advanced-ip-analyser"
          lintian --display-info --pedantic --fail-on error \
            "advanced-ip-analyser_${version}-1_source.changes" \
            "advanced-ip-analyser_${version}-1_all.deb"

      - name: Run installed-package tests
        run: |
          version="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          cd build-area
          set +e
          autopkgtest \
            "advanced-ip-analyser_${version}-1.dsc" \
            "advanced-ip-analyser_${version}-1_all.deb" \
            -- null > autopkgtest.log 2>&1
          autopkgtest_status=$?
          set -e
          cat autopkgtest.log
          grep -Eq '^cli[[:space:]]+PASS' autopkgtest.log
          grep -Eq '^gui[[:space:]]+PASS' autopkgtest.log
          test "$autopkgtest_status" -eq 0 || test "$autopkgtest_status" -eq 8

      - name: Upload sponsor-ready unsigned source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: advanced-ip-analyser-debian-source-unsigned
          path: |
            build-area/advanced-ip-analyser_*.debian.tar.xz
            build-area/advanced-ip-analyser_*.dsc
            build-area/advanced-ip-analyser_*_source.buildinfo
            build-area/advanced-ip-analyser_*_source.changes
            build-area/advanced-ip-analyser_*.orig.tar.gz
            build-area/advanced-ip-analyser_*_all.deb
            build-area/advanced-ip-analyser_*_amd64.buildinfo
            build-area/advanced-ip-analyser_*_amd64.changes
