[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-ip-analyser"
version = "2.8.7"
description = "An original Windows and Debian network inventory and host access utility"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "2E0LXY"}]
dependencies = ["defusedxml>=0.7.1", "psutil>=5.9,<8"]
classifiers = [
    "Environment :: X11 Applications",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
windows = ["keyring>=25,<26", "python-kasa>=0.11,<0.12", "tinytuya>=1.20,<2"]

[project.scripts]
advanced-ip-analyser = "ip_analyser.cli:main"
advanced-ip-analyser-gui = "ip_analyser.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
