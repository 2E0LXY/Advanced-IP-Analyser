name: Publish desktop 3.0.5 release tag (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-3-0-5-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create the desktop release tag on this main commit and start the release workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=3.0.5
          grep -Fq "version = \"$version\"" pyproject.toml
          grep -Fq "__version__ = \"$version\"" src/ip_analyser/__init__.py

          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            exit 0
          fi

          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/v$version" -f "sha=$GITHUB_SHA"
          gh workflow run debian.yml --repo "$GITHUB_REPOSITORY" --ref "v$version"
          gh workflow run windows.yml --repo "$GITHUB_REPOSITORY" --ref "v$version"
